site_name: RL Fine-Tuning of VLAs — Josué Mongan
site_description: Suivi de projet de recherche — RL Fine-Tuning de modèles VLA au Mila
site_author: Josué Mongan
site_url: https://josh012006.github.io/Website-IFT4055

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: images/icon.png
  icon:
    logo: material/robot

copyright: "&copy; 2026 <b>Josué Mongan</b> &ndash; Mila / Université de Montréal <br>Département d'informatique et de recherche opérationnelle"

repo_name: EXPO-FT fork
repo_url: https://github.com/Josh012006/expo-ft

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - pymdownx.keys
  - attr_list
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true

plugins:
  - search
  - macros
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
          nav_translations:
            Vue d'ensemble: Vue d'ensemble
            Suivi: Suivi
            Études préliminaires: Études préliminaires
            Réalisation: Réalisation
            Évaluation: Évaluation
        - locale: en
          name: English
          build: true
          nav_translations:
            Vue d'ensemble: Project Overview
            Suivi: Progress
            Études préliminaires: Preliminary Studies
            Réalisation: Implementation
            Évaluation: Evaluation

nav:
  - Vue d'ensemble: index.md
  - Suivi: suivi.md
  - Études préliminaires: analyse.md
  - Réalisation: realisation.md
  - Évaluation: evaluation.md